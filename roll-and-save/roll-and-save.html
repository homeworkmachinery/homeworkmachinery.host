<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLL & SAVE</title>
    <style>
   html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: rgb(100,80,143);
  color: #212121;
  font-family: BlinkMacSystemFont, -apple-system, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
  font-weight: 400;
  /* line-height: 1.5; */
  transition: background 150ms ease-in-out, color 150ms ease-in-out;
  display: flex;
  justify-content: center;
  align-items: center;  
  padding-right:40px;
  padding-left:40px;
}
.color-section{
    width: 100%;
    height: 100%;
    height: 100vh;
    overflow: hidden; 
    background: rgb(199,255,101);
}

body.power {
  background: #212121;
  color: #F5F5F5;
}

main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  max-width: 100%;
  position: relative; 
  z-index: 2;
}
.manifesto-background {
  position: absolute;
  margin-top:350px;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 0;
  width:800px;
  pointer-events: none;
}


.dice-container {
  margin-top:100px;
  display: flex;
  gap: 120px;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 3;
}

.die {
  display: block;
  height: 200px;
  width: 200px;
  transform-style: preserve-3d;
  transform-origin: 50% 50% -100px;
}

body:not(.power) .die:not(.rolling) {
  transition: transform 500ms ease-out;
}

.die.dieA > div {
    background: #F44336;
  border-color: rgb(242.6768867925, 44.3867924528, 29.8231132075);
}

.die.dieB > div {
    background: #0288D1;
  border-color: rgb(1.7582938389, 119.5639810427, 183.7417061611);
}

.die > div {
  border: 6px solid;
  box-sizing: border-box;
  border-radius: 12px;
  height: 200px;
  width: 200px;
  position: relative;
  backface-visibility: hidden;
  position: absolute;
  top: 0;
  left: 0;
}

.die > div:nth-child(1) {
  transform-origin: 0 100%;
  transform: translateY(-200px) rotateX(90deg);
}

.die > div:nth-child(2) {
  transform-origin: 100% 0;
  transform: translateX(-200px) rotateY(-90deg);
}

.die > div:nth-child(4) {
  transform-origin: 0 0;
  transform: translateX(200px) rotateY(90deg);
}

.die > div:nth-child(5) {
  transform-origin: 0 0;
  transform: translateY(200px) rotateX(-90deg);
}

.die > div:nth-child(6) {
  transform-origin: 50% 50%;
  transform: translateZ(-200px) rotateX(180deg);
}

.die > div > span {
  height: 40px;
  width: 40px;
  display: block;
  border-radius: 50%;
  position: absolute;
  background: white;
  backface-visibility: hidden;
  transform: translate(-50%, -50%);
}

.die > div[value="1"] > span:nth-child(1), .die > div[value="3"] > span:nth-child(3), .die > div[value="5"] > span:nth-child(5) {
  top: 50%;
  left: 50%;
}

.die > div[value="2"] > span:nth-child(1), .die > div[value="3"] > span:nth-child(1), .die > div[value="4"] > span:nth-child(1), .die > div[value="5"] > span:nth-child(1), .die > div[value="6"] > span:nth-child(1) {
  top: 20%;
  left: 20%;
}

.die > div[value="2"] > span:nth-child(2), .die > div[value="3"] > span:nth-child(2), .die > div[value="4"] > span:nth-child(2), .die > div[value="5"] > span:nth-child(2), .die > div[value="6"] > span:nth-child(2) {
  top: 80%;
  left: 80%;
}

.die > div[value="4"] > span:nth-child(3), .die > div[value="5"] > span:nth-child(3), .die > div[value="6"] > span:nth-child(3) {
  top: 20%;
  left: 80%;
}

.die > div[value="4"] > span:nth-child(4), .die > div[value="5"] > span:nth-child(4), .die > div[value="6"] > span:nth-child(4) {
  top: 80%;
  left: 20%;
}

.die > div[value="6"] > span:nth-child(5) {
  top: 50%;
  left: 20%;
}

.die > div[value="6"] > span:nth-child(6) {
  top: 50%;
  left: 80%;
}

.roll-button {
  padding: 5px;
  font-size: 50px;
  color: black;
  border: black 3px solid;
  background: white;
  cursor: pointer;
  display: block;
  z-index: 12;
  transition: all 0.2s ease;
  font-weight: bold;
  margin-top: 90px;
}

.roll-button:hover {
  background: #f0f0f0;
}

.roll-button:active {
  background: #e0e0e0;
}

.roll-button:disabled {

  cursor: not-allowed;
}

.result-display {
  margin-top: 20px;
  font-size: 28px;
  font-weight: bold;
  min-height: 50px;
  text-align: center;
}

.balance-display {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  color: rgb(255,251,57);
  text-shadow: black 2px;
  position: relative;
}

.balance-text {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgb(255,251,57);
  font-size: 35px;
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  white-space: nowrap;
}

.history-container {
  left:0;
  top: 0;
  height: 500px;
  display: flex;
  flex-direction: column;
  position: absolute;
}

.history-header {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
  flex-shrink: 0;
}

.history-display {
  font-size: 5.4vw;
  height: 300px;
  overflow-y: auto;
  line-height: 5.2vw;
  flex-grow: 1;
  margin-left: 2vw;
  color: rgb(100,80,143);
}

.win-message {
  color: yellow;
  font-weight: bold;
  font-size: 45px;
  position: absolute;
  top: 65%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.5);
  animation: winPulse 2s ease-in-out;
  z-index: 10;
  text-align: center;
  width: 100%;
  text-shadow: 
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000,
    2px 2px 0 #000,
    0 0 10px rgba(0, 0, 0, 0.8);
}

@keyframes winPulse {
  0% { 
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
  }
  50% { 
    transform: translate(-50%, -50%) scale(1.8);
    opacity: 1;
  }
  100% { 
    transform: translate(-50%, -50%) scale(1.5);
    opacity: 1;
  }
}

.history-item {
  padding: 5px 0;
  opacity: 1;
}

/* 光标样式 - 只对当前活跃的项显示 */
.history-item.active::after {
  content: '';
  display: inline-block;
  width: 3em;
  height: 1em;
  background-color: rgb(100,80,143);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink-caret 0.75s step-end infinite;
}

.manifestoclub {
  position: absolute;
  bottom: 0px;
  right: 50px;
  height: 255px;
  z-index: 0;

}

@keyframes blink-caret {
  from, to { opacity: 0; }
  50% { opacity: 1; }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes rotate {
  from {
    transform: rotateX(0) rotateY(0) rotateZ(0);
  }
  to {
    transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
  }
}
    </style>
</head>
<body>
    <div class="color-section">
    <main>
        <div class="balance-display" id="balanceDisplay">
           
        </div>
      
        <div class="dice-container">
            <!-- 骰子会在这里并排显示 -->
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button class="roll-button" id="rollButton">ROLL & SAVE</button>
            <div class="result-display" id="resultDisplay"></div>
            
            <div class="history-container">
                <div class="history-display" id="historyDisplay"></div>
            </div>
        </div>
    </main>

    <!-- 添加音频元素 -->
    <audio id="rollSound" preload="auto">
        <source src="roll.wav" type="audio/wav">
        <source src="roll.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>


    <img class="manifestoclub" src="./manifestoclub.png" >
</div>

</body>

<script>
    console.clear();

// 音频控制
let rollSound = document.getElementById('rollSound');
let audioEnabled = true;

// 预加载音频
rollSound.load();

// 处理音频加载错误
rollSound.addEventListener('error', function() {
    console.log('音频加载失败，请确保roll.wav文件存在');
    audioEnabled = false;
});

class Die {
  constructor($container) {
    this._createElement($container);
    this.x = 0;
    this.y = 0;
    this.z = 0;
    this.step = 0;
    this.isRolling = false;
  }

  roll() {
    if (this.isRolling) return;
    
    this.isRolling = true;
    this.$el.classList.add('rolling');
    
    // 开始旋转动画
    this.animateRoll();
  }

  animateRoll(count = 0) {
    if (count < 20) {
      this.step += 0.01;
      this.x += 5;
      this.y += 20;
      this.z += 5;
      this._setTransform();
      
      requestAnimationFrame(() => this.animateRoll(count + 1));
    } else {
      this.finishRoll();
    }
  }

  finishRoll() {
    this.index = Math.floor(Math.random() * 6);
    this.isRolling = false;
    this.$el.classList.remove('rolling');
    this._setFinalCoords();
    
    return this.value;
  }

  get value() { return this.sides[this.index] }

  _createElement($container) {
    this.$el = document.createElement('div');
    this.$el.className = `die ${this.type}`;
    for (let i = 0; i < 6; i++) {
      let $side = document.createElement('div'),
        value = this.sides[i];
      $side.setAttribute('value', value);
      for (let j = 0; j < value; j++)
        $side.innerHTML += '<span></span>';
      this.$el.appendChild($side);
    }
    $container.appendChild(this.$el);
  }
  
  _setFinalCoords() {
    let coords = [
      [85, 0, -5],
      [-5, 95, 0],
      [-5, 5, 0],
      [-5, 95, 0],
      [-95, 0, 5],
      [-5, 185, 0]
    ][this.index];

    this.x = coords[0];
    this.y = coords[1];
    this.z = coords[2];

    this._setTransform();
  }

  _setTransform() {
    let transform = 
      `rotateX(${this.x}deg) rotateY(${this.y}deg) rotateZ(${this.z}deg)`;
    this.$el.style.webkitTransform = transform;
    this.$el.style.transform = transform;
  }
}

class DieA extends Die {
  get sides() { return [1, 2, 3, 4, 5, 6] }
  get type() { return 'dieA' }
}

class DieB extends Die {
  get sides() { return [1, 2, 3, 4, 5, 6] }
  get type() { return 'dieB' }
}

// 游戏状态
let balance = 15;
let rollHistory = [];
let currentSessionHistory = [];
let activeHistoryItem = null;

// 初始化
let $container = document.querySelector('.dice-container');
let dieA = new DieA($container);
let dieB = new DieB($container);
let rollButton = document.getElementById('rollButton');
let resultDisplay = document.getElementById('resultDisplay');

let historyDisplay = document.getElementById('historyDisplay');

// 添加点击事件
rollButton.addEventListener('click', rollDice);



let winSound = new Audio(); // 创建 win.wav 音频对象
winSound.preload = 'auto';
winSound.src = 'win.wav';


// 处理 win.wav 音频加载错误
winSound.addEventListener('error', function() {
    console.log('win.wav 音频加载失败，请确保文件存在');
});


function rollDice() {
  // 禁用按钮防止重复点击
  rollButton.disabled = true;
  rollButton.textContent = 'ROLLING...';
  
  // 重置结果显示
  resultDisplay.textContent = '';
  resultDisplay.className = 'result-display';
  
  // 播放投掷音效（只在非获胜情况下播放）
  if (audioEnabled) {
    rollSound.currentTime = 0;
    rollSound.play().catch(e => {
      console.log('音频播放失败:', e);
      audioEnabled = false;
    });
  }
  
  // 开始投掷两个骰子
  dieA.roll();
  dieB.roll();
  
  // 等待动画结束后显示结果
  setTimeout(() => {
    let valueA = dieA.value;
    let valueB = dieB.value;
    
    let amountChange = 0;
    let isDouble = false;
    
    if (valueA === valueB) {
      // 相同点数 - 获胜，重置游戏
      isDouble = true;
      amountChange = 0;
      
      // 记录获胜回合
      const winResult = {
        dieA: valueA,
        dieB: valueB,
        timestamp: new Date().toLocaleTimeString(),
        amountChange: amountChange,
        newBalance: balance,
        isDouble: isDouble,
        isWin: true
      };
      rollHistory.unshift(winResult);
      currentSessionHistory.push(winResult);
      
      let resultText = `RESULT: ¥${balance}<br>`;
      resultText += "DOUBLE! YOU WIN! GAME RESET!";
      resultDisplay.className = 'result-display win-message';
      resultDisplay.innerHTML = resultText;
      
      // 重置余额为10元
      balance = 15;
      
      // 清空当前会话历史记录
      currentSessionHistory = [];
      updateHistoryDisplay();
      
      // 播放获胜音效并等待播放完成
      if (audioEnabled) {
        winSound.currentTime = 0;
        winSound.play().catch(e => {
          console.log('获胜音效播放失败:', e);
          // 如果音效播放失败，立即启用按钮
          rollButton.disabled = false;
          rollButton.textContent = 'ROLL & SAVE';
        });
        
        // 监听音效结束事件
        winSound.onended = function() {
      rollButton.disabled = false;
      rollButton.textContent = 'ROLL & SAVE';
      // // 音效结束后恢复结果文本到原位
      // setTimeout(() => {
      //   resultDisplay.className = 'result-display';
      //   resultDisplay.style.cssText = ''; // 清除内联样式
      // }, 1000);
    };
        // 设置最大等待时间（10秒），防止音效文件问题导致按钮一直被禁用
        setTimeout(() => {
          if (rollButton.disabled) {
            rollButton.disabled = false;
            rollButton.textContent = 'ROLL & SAVE';
          }
        }, 10000);
        
      } else {
        // 如果音频不可用，立即启用按钮
        rollButton.disabled = false;
        rollButton.textContent = 'ROLL & SAVE';

        setTimeout(() => {
      resultDisplay.className = 'result-display';
      resultDisplay.style.cssText = ''; // 清除内联样式
    }, 3000);


      }
      
    } else {
      // 不同点数 - 增加4元
      amountChange = 4;
      balance += amountChange;
      
      // 记录投掷历史
      const rollResult = {
        dieA: valueA,
        dieB: valueB,
        timestamp: new Date().toLocaleTimeString(),
        amountChange: amountChange,
        newBalance: balance,
        isDouble: isDouble,
        isWin: false
      };
      rollHistory.unshift(rollResult);
      currentSessionHistory.push(rollResult);
      
      // 只对新记录使用打字机效果
      addNewHistoryItem(rollResult);
      
      // 非获胜情况立即启用按钮
      rollButton.disabled = false;
      rollButton.textContent = 'ROLL & SAVE';
    }
  }, 1000);
}

// 添加新的历史记录项（带打字机效果）
function addNewHistoryItem(roll) {
    const isDouble = roll.isDouble;
    const doubleMark = isDouble ? '🎯 ' : '';
    const amountText = isDouble ? 
        '<span class="amount-change">WIN! RESET!</span>' : 
        `+¥${roll.amountChange}`;
    
    const fullText = `${doubleMark}${roll.timestamp}: RED=${roll.dieA} ! BLUE=${roll.dieB} [${amountText}]  [¥${roll.newBalance}]`;
    
    // 移除之前活跃项的光标
    if (activeHistoryItem) {
        activeHistoryItem.classList.remove('active');
    }
    
    // 创建新的历史项元素
    const historyItem = document.createElement('div');
    historyItem.className = 'history-item active';
    
    // 将新项添加到历史显示区域的最后面（向下排列）
    historyDisplay.appendChild(historyItem);
    
    // 设置当前活跃项
    activeHistoryItem = historyItem;
    
    // 自动滚动到最底部，确保新记录可见
    historyDisplay.scrollTop = historyDisplay.scrollHeight;
    
    // 开始打字机效果
    typeWriter(historyItem, fullText, 0, 30, () => {
        // 打字完成后光标继续闪烁
        // 不需要做任何操作，光标会持续闪烁
    });
}

// 更新历史显示（用于初始化和重置）
function updateHistoryDisplay() {
    historyDisplay.innerHTML = '';
    activeHistoryItem = null;
    
    // 为所有现有记录创建静态显示
    currentSessionHistory.forEach((roll, index) => {
        const isDouble = roll.isDouble;
        const doubleMark = isDouble ? '🎯 ' : '';
        const amountText = isDouble ? 
            '<span class="amount-change">WIN! RESET!</span>' : 
            `+¥${roll.amountChange}`;
        
        const fullText = `${doubleMark}${roll.timestamp}: RED=${roll.dieA}, BLUE=${roll.dieB} | ${amountText} |  ¥${roll.newBalance}`;
        
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.textContent = fullText;
        
        historyDisplay.appendChild(historyItem);
    });
    
    // 滚动到底部
    historyDisplay.scrollTop = historyDisplay.scrollHeight;
}

// 打字机效果函数
function typeWriter(element, text, currentIndex, speed, callback) {
    if (currentIndex < text.length) {
        element.textContent = text.substring(0, currentIndex + 1);
        setTimeout(() => {
            typeWriter(element, text, currentIndex + 1, speed, callback);
        }, speed);
    } else if (callback) {
        callback();
    }
}

// 初始显示
dieA.finishRoll();
dieB.finishRoll();
updateHistoryDisplay();
</script>
</html>
